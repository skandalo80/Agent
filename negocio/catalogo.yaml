# Catálogo del negocio: de aquí salen los precios de las cotizaciones.
# Claude NUNCA calcula precios: el código los toma de este archivo.
# Después de editarlo, reinicia el bot (sudo systemctl restart igbot).

negocio:
  nombre: Agentes IA by Skandar
  instagram: "@skandar.online"
  correo: skandar.carmach@gmail.com
  # Color del único detalle de acento en el PDF de cotización (el naranja de la marca).
  color_acento: "#C2410C"
  descripcion: >-
    Instalamos y operamos agentes de inteligencia artificial que atienden el
    Instagram de tu negocio 24/7: contestan DMs, agendan citas, mandan
    cotizaciones y avisan cuando hay un cliente listo para comprar.

# Demo en vivo dentro del mismo DM: el asesor pregunta a qué se dedica el negocio
# y contesta unos mensajes como lo haría su agente, con datos de ejemplo.
# Estos giros son una guía para el ejemplo, no un guion; agrega o quita los que quieras.
demo:
  giros:
    antro, bar o restaurante: reservaciones y listas, cover, horarios, menú y promociones del día
    tienda que vende por Instagram: precios, tallas o modelos, existencias, envíos y mandar la cotización
    distribuidora o negocio con CRM: cotización por volumen, registrar al cliente con sus datos y agendar una llamada con ventas
    consultorio, estética o servicios con cita: precios de servicios, horarios disponibles y apartar la cita

moneda: USD
vigencia_dias: 15
# El pago anual cobra este número de mensualidades (12 - 2 meses gratis).
meses_pagados_en_anual: 10

paquetes:
  basico:
    nombre: Básico
    resumen: solo contesta DMs con la información de tu negocio
    instalacion: 49
    mensualidad: 29
    respuestas_mes: 1000
    incluye:
      - Responde DMs 24/7 con IA, con el tono y la información de tu negocio
      - Recuerda a cada cliente (memoria por persona)
      - Preguntas frecuentes y botones de inicio
      - Se calla en la conversación cuando tú contestas a mano
  community:
    nombre: Community Manager
    resumen: además de contestar, cuida tus comentarios y te ayuda con el contenido, sin conectar nada fuera de Instagram
    instalacion: 99
    mensualidad: 79
    respuestas_mes: 2500
    incluye:
      - Todo lo del Básico
      - "Comentarios: respuesta pública, \"comenta X y te mando DM\" y filtro de spam"
      - Te escribe el texto de tus publicaciones (por ejemplo "comenta PRECIO y te mando la info")
      - Publica en tu Instagram mandándole la foto por DM (al momento o programado)
      - Pasar a humano (pausa la conversación cuando el cliente pide una persona)
      - Reporte semanal por DM
  pro_crm:
    nombre: Pro CRM
    resumen: completo y a la medida, enfocado en captar leads y conectado a tus sistemas
    instalacion: 249
    mensualidad: 179
    respuestas_mes: 5000
    incluye:
      - Todo lo del Community Manager
      - Captura de leads y conexión con tu CRM
      - Conexión a tu inventario, precios o base de datos (Google Sheets u otro sistema)
      - Cotizaciones en PDF con tu marca, por DM o por correo
      - Agenda citas en Google Calendar con link de Meet
      - Manda correos y te avisa de prospectos listos para comprar
      - Reporte semanal por correo

extras:
  respuestas:
    descripcion: Bloque de 500 respuestas adicionales al mes
    bloque: 500
    precio: 15
    max_bloques: 20

condiciones:
  - La instalación se paga una sola vez, al contratar.
  - La mensualidad se cobra por adelantado; se puede cancelar en cualquier momento.
  - Con pago anual pagas 10 mensualidades y recibes 12 meses de servicio.
  - Las respuestas no usadas no se acumulan al mes siguiente.
  - En Pro CRM, las integraciones con sistemas fuera de lo común se cotizan aparte después de revisarlas.
