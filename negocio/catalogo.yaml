# Catálogo del negocio: de aquí salen los precios de las cotizaciones.
# Claude NUNCA calcula precios: el código los toma de este archivo.
# Después de editarlo, reinicia el bot (sudo systemctl restart igbot).

negocio:
  nombre: Skandar
  instagram: "@skandar.online"
  correo: skandar.carmach@gmail.com
  # Color del único detalle de acento en el PDF de cotización (el naranja de la marca).
  color_acento: "#C2410C"
  descripcion: >-
    Tus redes sociales, trabajando. Un asistente que contesta cada mensaje al
    instante, también los que llegan de tus anuncios, y lo lleva a la venta; un
    Community Manager que mantiene tu perfil activo con contenido de tu marca; y
    la medición de qué anuncio trajo a cada cliente, todo en una sola plataforma.

# Demo en vivo dentro del mismo DM: el asesor pregunta a qué se dedica el negocio
# y contesta unos mensajes como lo haría su agente, con datos de ejemplo.
# Estos giros son una guía para el ejemplo, no un guion; agrega o quita los que quieras.
demo:
  giros:
    antro, bar o restaurante: reservaciones y listas, cover, horarios, menú y promociones del día
    tienda que vende por Instagram: precios, tallas o modelos, existencias, envíos y cómo pagar
    consultorio, estética o servicios con cita: precios de servicios, horarios y cómo apartar la cita
    marca que necesita contenido: tres ideas de post para su negocio con tema, formato y hora sugerida

moneda: USD
vigencia_dias: 15
# El pago anual cobra este número de mensualidades (12 - 2 meses gratis).
meses_pagados_en_anual: 10
# Sin instalación y sin mes gratis: se paga desde el primer mes.
primer_mes_gratis: false
# Los precios no incluyen IVA: se muestran como "US$49 + IVA".
precios_mas_iva: true

# Las claves (basico, community) son las mismas de PLAN= en el .env de cada cliente.
# instalacion: 0 = sin costo de instalación (no sale en la cotización).
paquetes:
  basico:
    nombre: Asistente virtual
    resumen: contesta al instante tus mensajes directos, también los de tus anuncios, con la información de tu negocio
    instalacion: 0
    mensualidad: 49
    respuestas_mes: 1500
    incluye:
      - Responde tus DMs 24/7 con IA, con tu información y tu tono
      - Lo configuras tú desde el panel (tu negocio, precios, preguntas frecuentes y políticas)
      - Recuerda a cada cliente (memoria por persona)
      - Sabe a qué historia o anuncio le responden y agradece cuando te mencionan en una historia
      - Te pasa la conversación cuando el cliente pide una persona, y se calla cuando tú contestas
      - Contesta también Facebook Messenger y los comentarios de tu página, si la conectas
      - Agenda citas en tu Google Calendar, si lo conectas
      - Cobra con links de pago de Mercado Pago o Stripe, si los conectas
      - Marca los chats que llegan de tus anuncios y la venta que dejó cada uno (pagos por link o Shopify)
      - Panel con Inicio (lo de hoy), tus conversaciones y tus resultados
  community:
    nombre: Community Manager
    resumen: el asistente más un Community Manager que mantiene tu perfil activo con contenido de tu marca
    instalacion: 0
    mensualidad: 79
    respuestas_mes: 2500
    incluye:
      - Todo lo del Asistente virtual
      - Campañas con calendario automático armado con la información de tu negocio, listas para programar
      - Campañas para promocionar un producto o servicio con descuento, 2x1 o 3x2
      - Campañas de prueba (temas, formatos y horarios distintos) y campañas que repiten lo que mejor te funcionó
      - Contenido sugerido a partir de lo que te preguntan en DMs y comentarios
      - Genera cada post (imagen y texto) según Tu marca, tus colores, tus fotos y las referencias que le des
      - Publica solo en tu Instagram y tu página de Facebook a la hora programada
      - Contesta los comentarios de tus posts según su tipo, en público, por DM o ambos; agradece las menciones y oculta el spam
      - Palabra clave por post o general ("comenta PRECIO y te mando la info por DM")
      - Reportes de tus campañas con tus métricas reales y de tus comentarios (cuántos llegaron, cuántos se contestaron, de qué tipo)
      - 12 posts al mes con imagen

extras:
  respuestas:
    descripcion: Bloque de 500 respuestas adicionales al mes
    bloque: 500
    precio: 15
    max_bloques: 20

condiciones:
  - Los precios no incluyen IVA (16% para clientes en México).
  - Sin costo de instalación.
  - La mensualidad se cobra por adelantado desde el primer mes; se puede cancelar en cualquier momento.
  - Con pago anual pagas 10 mensualidades y recibes 12 meses de servicio.
  - Las respuestas no usadas no se acumulan al mes siguiente.
